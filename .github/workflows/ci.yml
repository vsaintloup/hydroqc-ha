name: CI
on:
  push:
    branches: [main, feat/gmail-auto-mfa]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (Python 3.14 / HA 2026.11.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check custom_components/
      - run: uv run ruff format --check custom_components/
      - run: uv run mypy custom_components/hydroqc/
  test:
    name: Tests (Python 3.14 / HA 2026.11.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Confirm tested versions
        run: uv run python -c "from importlib.metadata import version; print(version('homeassistant')); print(version('Hydro-Quebec-API-Wrapper'))"
      - run: uv run python scripts/run_tests.py --cov=custom_components.hydroqc --cov-report=term-missing --tb=short
      - name: Validate JSON
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          for file in Path("custom_components/hydroqc").rglob("*.json"):
              json.loads(file.read_text())
          PY
